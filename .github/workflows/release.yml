name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check VERSION and every manifest
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CANONICAL="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$CANONICAL" ]; then
            echo "release tag v${TAG_VERSION} does not match VERSION=${CANONICAL}" >&2
            exit 1
          fi
          python scripts/version.py check

  build-native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        working-directory: rust/apex-rs
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: rust/apex-rs
        run: |
          set -euo pipefail
          ASSET="apex-rs-${{ matrix.target }}.tar.gz"
          mkdir -p ../../dist-native
          tar -czf "../../dist-native/${ASSET}" -C "target/${{ matrix.target }}/release" apex-rs
          cd ../../dist-native
          sha256sum "${ASSET}" > "${ASSET}.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: rust/apex-rs
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "apex-rs-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Path "../../dist-native" -Force | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/apex-rs.exe" -DestinationPath "../../dist-native/$asset" -Force
          $hash = (Get-FileHash "../../dist-native/$asset" -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -FilePath "../../dist-native/$asset.sha256" -Encoding ascii -NoNewline

      - name: Upload native asset
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist-native/
          if-no-files-found: error

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: verify-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  npm-package:
    name: Test & Publish npm Package
    runs-on: ubuntu-latest
    needs: [verify-version]
    if: success()
    permissions:
      contents: read
    env:
      # The `secrets` context is not allowed in `if` conditions, so the
      # token is surfaced through a job-level env var and tested there.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: integrations/npm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify package version matches the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const v=require('./package.json').version; if (process.argv[1] !== v) { console.error('npm package version ' + v + ' does not match release tag v' + process.argv[1]); process.exit(1) }" "$VERSION"
          echo "npm package version matches v${VERSION}"

      - name: Run tests
        run: npm test

      - name: Require NPM_TOKEN
        if: ${{ env.NPM_TOKEN == '' }}
        run: |
          echo "::error::NPM_TOKEN is missing; apex-ai cannot be published to npm. Add the repository secret and re-run."
          exit 1

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-native]
    if: success()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version (strip v prefix)
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist-native/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-native/*
          body: |
            ## APEX v${{ steps.version.outputs.VERSION }}

            The universal AI coding agent. Every model. One terminal.

            ### Installation

            APEX ships through npm and the native Rust backend only.

            ```bash
            # npm — provides the `apex` command and downloads the verified backend
            npm install -g apex-ai@${{ steps.version.outputs.VERSION }}
            apex run "Fix the bug"

            # Native backend (headless: serve, run, tools)
            bash install.sh --method native --version ${{ steps.version.outputs.VERSION }}
            ~/.apex/bin/apex-rs serve --port 8765

            # Unified installer (auto | npm | native | docker)
            bash install.sh --method auto --version ${{ steps.version.outputs.VERSION }}
            ```

            ### Docker

            ```bash
            docker pull ghcr.io/ggboykxz/apex:${{ steps.version.outputs.VERSION }}
            docker run -it -v $(pwd):/workspace ghcr.io/ggboykxz/apex
            ```

            ### Native backend

            The Rust backend ships as a verified release asset for Linux
            (x86_64/aarch64), macOS (x86_64/aarch64) and Windows (x86_64).
            Each `apex-rs-<target>.tar.gz|.zip` has a `.sha256` sidecar; the
            installer and the npm wrapper verify it before writing anything.
            The binary is headless and is installed as `apex-rs`, never `apex`.

            The Python package is no longer published on PyPI; PyPI, pip, pipx
            and uv are not installation channels.

            ### Full Changelog
            See [CHANGELOG.md](https://github.com/Ggboykxz/APEX/blob/main/CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
