name: Welcome

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Greet new contributors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isIssue = !!context.payload.issue;
            const target = isIssue ? context.payload.issue : context.payload.pull_request;
            const body = isIssue
              ? 'Merci d\'avoir ouvert cette issue ! 🎉\n\nAvant de soumettre, vérifiez que le problème n\'est pas déjà traité (recherche dans les issues ouvertes) et fournissez les étapes de reproduction si c\'est un bug.'
              : 'Merci pour cette pull request ! 🎉\n\nLa CI s\'exécute automatiquement. Assurez-vous que les checks passent et que le commit suit le format Conventional Commits (ex. `fix(security): ...`, `feat(rust): ...`).';
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: target.number,
              body,
            };
            // Only greet authors that have not contributed before.
            const { data: issues } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} author:${target.user.login}`,
            });
            if (issues.total_count <= 1) {
              await github.rest.issues.createComment(params);
            }
