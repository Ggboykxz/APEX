name: Dependency Audit

on:
  schedule:
    - cron: "0 5 * * 1"  # Every Monday at 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tui-frontend/package.json"
      - "tui-frontend/package-lock.json"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tui-frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: npm audit (website)
        run: npm audit --omit=dev
        continue-on-error: true

      - name: npm audit (TUI)
        working-directory: tui-frontend
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit (requirements)
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: pip-audit (pyproject)
        run: pip-audit -r <(python -c "import tomllib, pathlib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('\n'.join(d['project']['dependencies']))")
        continue-on-error: true
