# Release Drafter configuration for APEX

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
template: |
  ## APEX v$RESOLVED_VERSION

  The universal AI coding agent. Every model. One terminal.

  ### Changes

  $CHANGES

  ### Installation

  APEX ships through npm and the native Rust backend only (no PyPI, pip,
  pipx or uv).

  ```bash
  # npm — provides the `apex` command and downloads the verified backend
  npm install -g apex-ai@$RESOLVED_VERSION

  # Native backend (headless: serve, run, tools)
  bash install.sh --method native --version $RESOLVED_VERSION

  # Installer (macOS/Linux)
  curl -fsSLO https://apex-ai.dev/install.sh
  bash install.sh --method auto --version $RESOLVED_VERSION

  # Installer (Windows PowerShell)
  Invoke-WebRequest https://apex-ai.dev/install.ps1 -OutFile install.ps1
  powershell -ExecutionPolicy Bypass -File .\install.ps1 -Method auto
  ```

  ### Native backend

  Verified release assets ship for Linux (x86_64/aarch64), macOS
  (x86_64/aarch64) and Windows (x86_64), each with a `.sha256` sidecar. The
  binary is installed as `apex-rs`, never `apex`.

  ### Docker

  ```bash
  docker pull ghcr.io/ggboykxz/apex:$RESOLVED_VERSION
  docker run -it -v $(pwd):/workspace ghcr.io/ggboykxz/apex
  ```

  ### Quick Start

  ```bash
  export ANTHROPIC_API_KEY=sk-ant-...
  apex                          # Interactive mode
  apex --model gpt-4o           # Start with GPT-4o
  apex --model ollama-llama3    # Local, no API key
  ```

  **Full Changelog**: https://github.com/Ggboykxz/APEX/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: "🚀 Features"
    labels:
      - feature
      - enhancement
      - feat
  - title: "🐛 Bug Fixes"
    labels:
      - bug
      - fix
      - bugfix
  - title: "📚 Documentation"
    labels:
      - documentation
      - docs
  - title: "♻️ Refactoring"
    labels:
      - refactor
      - refactoring
  - title: "⚡ Performance"
    labels:
      - perf
      - performance
  - title: "🧪 Tests"
    labels:
      - test
      - tests
  - title: "🔧 CI/CD"
    labels:
      - ci
      - build
  - title: "🎫 Chores"
    labels:
      - chore
      - dependencies
  - title: "🔒 Security"
    labels:
      - security

label-template: "$TITLE @$AUTHOR (#$NUMBER)"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - breaking
      - major
  minor:
    labels:
      - feature
      - enhancement
      - feat
  patch:
    labels:
      - bug
      - fix
      - bugfix
      - security
      - chore
      - dependencies
  default: patch

exclude-labels:
  - skip-changelog
  - stale
  - wontfix
