name: Bug report
description: Report a reproducible defect in APEX
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        For security vulnerabilities, do **not** open a public issue — follow `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the defect.
      placeholder: When I run `apex ...`, ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps.
      placeholder: |
        1. Install APEX ...
        2. Run `apex ...`
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: APEX version
      description: Output of `apex --version`.
      placeholder: 2.0.0
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI / Python backend
        - TUI (tui-frontend)
        - Rust port (apex-rs)
        - Website / docs
        - CI / tooling
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, terminal.
      placeholder: Windows 11, Python 3.12, Windows Terminal
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs with secrets removed. Never include API keys or tokens.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed API keys, tokens, and other secrets from logs.
          required: true
